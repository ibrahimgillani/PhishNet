<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https:; img-src 'self' data: blob: https:; connect-src 'self' https: http://localhost:*;">
  <title>Scan Results - PhishNet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary-blue: #0B63D9;
      --accent-cyan: #00B7D9;
      --bg-dark: #0b0b0b;
      --card-bg: #0f0f10;
      --text-primary: #FFFFFF;
      --text-muted: #999999;
      --border-color: rgba(255,255,255,0.06);
      --color-safe: #00FF88;
      --color-malicious: #FF4D4D;
      --color-suspicious: #FFC107;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 6px;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 24px;
      background-image: radial-gradient(rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .scn-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ===== Header ===== */
    .scn-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding: 1.25rem 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      animation: scn-slideUp 0.3s ease-out;
    }
    .scn-header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .scn-logo-icon {
      width: 40px; height: 40px;
      background: rgba(11,99,217,0.1);
      border: 1px solid rgba(11,99,217,0.2);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scn-logo-icon svg { width: 20px; height: 20px; color: var(--primary-blue); }
    .scn-header h1 {
      font-family: 'Inter', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
    }
    .scn-header p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin: 0.15rem 0 0;
    }
    .scn-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .scn-back-btn:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text-primary);
    }
    .scn-back-btn svg { width: 14px; height: 14px; }

    /* ===== Table Card ===== */
    .scn-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 4px 40px rgba(0,0,0,0.15);
      animation: scn-slideUp 0.4s ease-out;
    }
    @keyframes scn-slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .scn-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    .scn-card-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .scn-card-title svg { width: 16px; height: 16px; color: var(--primary-blue); }
    .scn-count-badge {
      background: rgba(11,99,217,0.1);
      color: var(--primary-blue);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 12px;
    }

    /* ===== Table ===== */
    .scn-table-wrap {
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(11,99,217,0.4) rgba(255,255,255,0.03);
    }
    .scn-table-wrap::-webkit-scrollbar { height: 6px; }
    .scn-table-wrap::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
    .scn-table-wrap::-webkit-scrollbar-thumb { background: rgba(11,99,217,0.4); border-radius: 3px; }

    #scan-results-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }
    #scan-results-table th,
    #scan-results-table td {
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.82rem;
      border: none;
      vertical-align: middle;
      white-space: nowrap;
    }
    #scan-results-table th:nth-child(1),
    #scan-results-table td:nth-child(1) {
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #scan-results-table th:nth-child(5),
    #scan-results-table td:nth-child(5) {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #scan-results-table thead {
      background: rgba(11,99,217,0.06);
    }
    #scan-results-table th {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
    }
    #scan-results-table tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: background 0.15s ease;
    }
    #scan-results-table tbody tr:last-child { border-bottom: none; }
    #scan-results-table tbody tr:hover {
      background: rgba(11,99,217,0.04);
    }
    #scan-results-table td {
      color: rgba(255,255,255,0.85);
    }

    /* Result badges */
    #scan-results-table .result-safe {
      color: var(--color-safe);
      font-weight: 700;
      background: rgba(0,255,136,0.08);
      padding: 0.2rem 0.55rem;
      border-radius: 12px;
      font-size: 0.72rem;
      display: inline-block;
    }
    #scan-results-table .result-suspicious {
      color: var(--color-suspicious);
      font-weight: 700;
      background: rgba(255,193,7,0.08);
      padding: 0.2rem 0.55rem;
      border-radius: 12px;
      font-size: 0.72rem;
      display: inline-block;
    }
    #scan-results-table .result-malicious {
      color: var(--color-malicious);
      font-weight: 700;
      background: rgba(255,77,77,0.08);
      padding: 0.2rem 0.55rem;
      border-radius: 12px;
      font-size: 0.72rem;
      display: inline-block;
    }

    /* Action Buttons */
    .action-btn {
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      margin-right: 4px;
      white-space: nowrap;
    }
    .view-btn {
      background: rgba(11,99,217,0.1);
      color: var(--primary-blue);
      border: 1px solid rgba(11,99,217,0.2);
    }
    .view-btn:hover {
      background: var(--primary-blue);
      color: #fff;
      border-color: var(--primary-blue);
    }
    .delete-btn {
      background: rgba(255,77,77,0.08);
      color: #FF4D4D;
      border: 1px solid rgba(255,77,77,0.15);
    }
    .delete-btn:hover {
      background: #FF4D4D;
      color: #fff;
      border-color: #FF4D4D;
    }

    /* Delete confirmation modal */
    .delete-confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      backdrop-filter: blur(6px);
    }
    .delete-confirm-modal {
      background: linear-gradient(160deg, #0f172a 0%, #0b1224 100%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      width: min(440px, 92%);
      color: #fff;
      box-shadow: 0 18px 60px rgba(0,0,0,0.55);
      animation: scn-pop 0.18s ease-out;
    }
    @keyframes scn-pop {
      from { transform: translateY(6px) scale(0.98); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .delete-confirm-header {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }
    .delete-confirm-icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: rgba(239,68,68,0.12);
      color: #ef4444;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 0 0 1px rgba(239,68,68,0.25);
    }
    .delete-confirm-title { margin: 0; font-size: 1.08rem; letter-spacing: 0.01em; }
    .delete-confirm-subtext { margin: 2px 0 0; color: #cbd5e1; font-size: 0.93rem; }
    .delete-confirm-body { margin: 8px 0 6px; }
    .delete-confirm-message { margin: 0 0 6px; line-height: 1.55; color: #e2e8f0; overflow-wrap: anywhere; word-break: break-word; }
    .delete-confirm-note { margin: 0; font-size: 0.9rem; color: #94a3b8; }
    .delete-confirm-highlight {
      color: #fff; font-weight: 800; display: inline-block; max-width: 100%;
      overflow-wrap: anywhere; word-break: break-word;
      background: rgba(239,68,68,0.14); padding: 6px 8px; border-radius: 8px;
    }
    .delete-confirm-actions { margin-top: 16px; display: flex; justify-content: flex-end; gap: 12px; }
    .modal-btn {
      padding: 11px 14px; border-radius: 10px; border: none; font-weight: 750;
      cursor: pointer; transition: all 0.15s ease; font-size: 0.95rem;
    }
    .modal-btn.secondary {
      background: #1f2937; color: #e5e7eb; border: 1px solid rgba(255,255,255,0.08);
    }
    .modal-btn.secondary:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .modal-btn.danger {
      background: linear-gradient(135deg, #ef4444, #f97373); color: #fff;
      box-shadow: 0 10px 28px rgba(239,68,68,0.35);
    }
    .modal-btn.danger:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(239,68,68,0.45); }

    /* ===== Empty state ===== */
    .scn-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }
    .scn-empty svg { width: 48px; height: 48px; opacity: 0.3; margin-bottom: 1rem; }
    .scn-empty p { font-size: 0.88rem; }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      body { padding: 14px; }
      .scn-header { flex-direction: column; gap: 1rem; text-align: center; }
      .scn-header-left { flex-direction: column; }
      #scan-results-table th, #scan-results-table td { padding: 0.6rem 0.75rem; font-size: 0.78rem; }
      .action-btn { padding: 0.3rem 0.6rem; font-size: 0.68rem; }
    }
    @media (max-width: 480px) {
      body { padding: 10px; }
      .scn-card-header { padding: 0.75rem 1rem; }
      #scan-results-table th, #scan-results-table td { padding: 0.5rem 0.6rem; font-size: 0.72rem; }
      
      .issues-table-wrapper { overflow-x: auto !important; -webkit-overflow-scrolling: touch !important; border: 1px solid var(--border-color) !important; border-radius: 8px !important; width: 100% !important; }
      .issues-table { min-width: 700px !important; font-size: 0.7rem !important; display: table !important; }
      .issues-table thead { display: table-header-group !important; }
      .issues-table tbody { display: table-row-group !important; }
      .issues-table tr { display: table-row !important; }
      .issues-table th, .issues-table td { display: table-cell !important; padding: 0.6rem !important; font-size: 0.7rem !important; white-space: normal !important; word-wrap: break-word !important; }
      .issues-table th { font-size: 0.65rem !important; padding: 0.7rem 0.6rem !important; }
    }
  </style>
</head>
<body>
  <div class="scn-container">
    <header class="scn-header">
      <div class="scn-header-left">
        <div class="scn-logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div>
          <h1>Scan Results</h1>
          <p>View and manage your phishing detection scan history</p>
        </div>
      </div>
      <a href="index.html" class="scn-back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Home
      </a>
    </header>

    <div class="scn-card">
      <div class="scn-card-header">
        <span class="scn-card-title">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Scan History
        </span>
      </div>
      <div class="scn-table-wrap">
        <table id="scan-results-table">
          <thead>
            <tr>
              <th>Target</th>
              <th>Type</th>
              <th>Result</th>
              <th>Confidence</th>
              <th>Time</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Rows inserted dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="scan-results.js"></script>
</body>
</html>
